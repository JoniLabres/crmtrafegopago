<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup Inicial — IXCTraffic</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #111;
      color: #fff;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%; max-width: 440px;
    }
    .badge {
      display: inline-block;
      background: rgba(163,255,0,.12);
      color: #a3ff00;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 50px;
      border: 1px solid rgba(163,255,0,.25);
      margin-bottom: 1.25rem;
    }
    h2 { font-size: 1.3rem; font-weight: 800; margin-bottom: 0.4rem; }
    .subtitle { font-size: 0.85rem; color: #888; margin-bottom: 2rem; line-height: 1.5; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 0.4rem; font-weight: 500; }
    input {
      width: 100%; background: #111; border: 1px solid #333;
      border-radius: 8px; padding: 0.65rem 0.85rem;
      font-size: 0.9rem; color: #fff; font-family: inherit;
      transition: border-color .15s; outline: none;
    }
    input:focus { border-color: #a3ff00; }
    input::placeholder { color: #555; }
    .btn {
      width: 100%; background: #a3ff00; color: #0a0a0a;
      border: none; border-radius: 8px; padding: 0.7rem;
      font-size: 0.9rem; font-weight: 700; font-family: inherit;
      cursor: pointer; margin-top: 0.5rem;
    }
    .btn:hover { background: #b8ff33; }
    .error {
      background: rgba(255,68,68,.12); border: 1px solid rgba(255,68,68,.3);
      border-radius: 8px; color: #ff6b6b; font-size: 0.82rem;
      padding: 0.65rem 0.85rem; margin-bottom: 1rem;
    }
    .hint { font-size: 0.75rem; color: #555; margin-top: 0.35rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Setup Inicial</div>
    <h2>Criar conta administrador</h2>
    <p class="subtitle">
      Esta é a primeira vez que a plataforma é acessada.
      Crie a conta de administrador para proteger o acesso.
      Após isso, você poderá adicionar outros usuários.
    </p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/setup">
      <div class="form-group">
        <label>Seu nome</label>
        <input type="text" name="name" placeholder="João Silva"
               value="{{ name or '' }}" required autofocus>
      </div>
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" name="email" placeholder="voce@empresa.com"
               value="{{ email or '' }}" required>
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" name="password" placeholder="Mínimo 8 caracteres" required>
        <p class="hint">Use uma senha forte — mínimo 8 caracteres.</p>
      </div>
      <div class="form-group">
        <label>Confirmar senha</label>
        <input type="password" name="confirm" placeholder="Repita a senha" required>
      </div>
      <button type="submit" class="btn">Criar administrador e entrar</button>
    </form>
  </div>
</body>
</html>
